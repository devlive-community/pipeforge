#
# Local development environment. Start it with pipeforge dev up (or dev/up.sh) and stop it
# with pipeforge dev down (or dev/down.sh).
# Every port can be changed through an environment variable (see dev/.env.example).
# Credentials here are for local development only.
#
# MinIO runs only with the "s3" profile (dev/up.sh --s3). The MinIO project no longer
# publishes community images on Docker Hub, so the image is configurable through
# PIPEFORGE_MINIO_IMAGE; it must contain both the minio server and the mc client.

name: pipeforge-dev

services:
  mysql:
    image: mysql:8.4
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: pipeforge
      MYSQL_DATABASE: pipeforge
      MYSQL_USER: pipeforge
      MYSQL_PASSWORD: pipeforge
      TZ: UTC
    ports:
      - "${PIPEFORGE_MYSQL_PORT:-33306}:3306"
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -upipeforge -ppipeforge -h127.0.0.1 -e 'SELECT COUNT(*) FROM pipeforge.orders' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    image: postgres:16
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_DB: pipeforge
      POSTGRES_USER: pipeforge
      POSTGRES_PASSWORD: pipeforge
      TZ: UTC
    ports:
      - "${PIPEFORGE_POSTGRES_PORT:-35432}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeforge -d pipeforge && psql -U pipeforge -d pipeforge -tAc 'SELECT 1 FROM inventory.products LIMIT 1' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio:
    image: ${PIPEFORGE_MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    profiles: [s3]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: pipeforge
      MINIO_ROOT_PASSWORD: pipeforge-secret
    ports:
      - "${PIPEFORGE_MINIO_PORT:-39000}:9000"
      - "${PIPEFORGE_MINIO_CONSOLE_PORT:-39001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the buckets used by examples and checkpoints, then exits. One-off services end in
  # "-init": pipeforge dev status counts them as completed when they exit with 0.
  minio-init:
    image: ${PIPEFORGE_MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    profiles: [s3]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 pipeforge pipeforge-secret &&
        mc mb --ignore-existing local/pipeforge local/pipeforge-checkpoints
    restart: "no"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      - "${PIPEFORGE_TOXIPROXY_PORT:-38474}:8474"
      - "${PIPEFORGE_TOXIPROXY_MYSQL_PORT:-43306}:23306"
      - "${PIPEFORGE_TOXIPROXY_POSTGRES_PORT:-45432}:25432"
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "${PIPEFORGE_PROMETHEUS_PORT:-39090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: pipeforge
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "${PIPEFORGE_GRAFANA_PORT:-33000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": *\"ok\"'"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  postgres-data:
  minio-data:
