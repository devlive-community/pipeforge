# Scrapes Prometheus itself and a PipeForge process on the host (metrics port 9250).

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: pipeforge
    static_configs:
      - targets: ["host.docker.internal:9250"]
