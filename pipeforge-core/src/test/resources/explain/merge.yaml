version: 1
name: orders-merge
env:
  timezone: UTC
  sink.batch-size: 100
source:
  - { id: history, type: fake }
  - { id: live, type: events }
sink:
  - { id: out, type: console, inputs: [history, live], limit: 5 }
  - { id: audit, type: console, inputs: live }
