version: 1
name: orders-daily
description: Daily copy of the orders table
env:
  parallelism: 4
  variables:
    biz_date: "${date:yyyy-MM-dd,-1d}"
  source:
    fetch-size: 500
source:
  - id: src
    type: fake
    rows: 1000
    password: s3cret
transform:
  - id: map
    type: rename
    from: name
    to: customer
sink:
  - id: out
    type: console
    parallelism: 1
