// Frozen as v1: copied verbatim from the protocol specification, appendix A. Only compatible
// additions are allowed (new fields, RPCs and enum values); ProtoSnapshotTest checks it.

syntax = "proto3";
package pipeforge.rpc.v1;
option java_package = "org.devlive.pipeforge.engine.rpc.proto";
option java_multiple_files = true;

import "pipeforge/rpc/v1/common.proto";
import "pipeforge/rpc/v1/resource_manager.proto";
import "pipeforge/rpc/v1/task_executor.proto";

service DispatcherService {
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc CancelJob(JobRequest) returns (Ack);
  rpc GetJobStatus(JobRequest) returns (JobStatus);
  rpc GetJobMetrics(JobRequest) returns (JobMetrics);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc Analyze(JobRequest) returns (ExplainResult);
  rpc ReadTaskLog(ReadTaskLogRequest) returns (stream LogChunk);  // 兼容增加：Master 转发给运行该 Task 的 Worker
  rpc ListSplits(JobRequest) returns (ListSplitsResponse);         // 兼容增加：分片的归属与进度
  rpc GetCluster(ClusterRequest) returns (ClusterStatus);           // 兼容增加：Master 与 Worker 的状态
  // M2：TriggerSavepoint、StopWithSavepoint
}

message SubmitJobRequest {
  Header header = 1;
  string job_id = 2;
  string run_id = 3;                  // Server 生成；重复提交同一 run_id 幂等
  string definition = 4;              // 作业定义文本
  string definition_format = 5;       // yaml / json
  map<string, string> variables = 6;  // 解析后的变量
  int64 scheduled_time_ms = 7;
  repeated PluginRef plugins = 8;     // Server 选定的插件版本，Master 按它计划
  int64 timeout_ms = 9;               // 0 表示不限
}

message SubmitJobResponse {
  string run_id = 1;
}

message JobRequest {
  Header header = 1;
  string run_id = 2;
  string reason = 3;                  // CancelJob 时填写
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_QUEUE = 1;
  RUN_STATE_RUNNING = 2;
  RUN_STATE_SUCCESS = 3;
  RUN_STATE_FAILED = 4;
  RUN_STATE_CANCELLING = 5;
  RUN_STATE_CANCELLED = 6;
  RUN_STATE_TIMEOUT = 7;
  // M2 起：RUN_STATE_RESTARTING、_PAUSING、_PAUSED、_RETRY_WAIT、_ROLLING_BACK、_INTERRUPTED，按顺序追加
}

message TaskStatus {
  ExecutionAttemptId id = 1;
  TaskState state = 2;
  string worker_id = 3;
  ErrorInfo error = 4;
}

message JobStatus {
  string run_id = 1;
  string job_id = 2;
  string job_name = 3;
  RunState state = 4;
  int64 start_ms = 5;
  int64 end_ms = 6;                   // 未结束为 0
  ErrorInfo error = 7;
  repeated TaskStatus tasks = 8;
}

message NodeMetrics {
  string node_id = 1;
  int32 parallelism = 2;
  int64 rows_in = 3;
  int64 rows_out = 4;
  int64 rows_filtered = 5;
  int64 rows_expanded = 6;
  int64 rows_dirty = 7;
  int64 bytes_in = 8;
  int64 bytes_out = 9;
  int64 self_time_nanos = 10;
  int64 reader_wait_nanos = 11;
  int64 writer_wait_nanos = 12;
  int64 back_pressured_nanos = 13;
}

message JobMetrics {
  string run_id = 1;
  int64 timestamp_ms = 2;
  repeated NodeMetrics nodes = 3;
  int32 splits_total = 4;
  int32 splits_finished = 5;
  int64 elapsed_ms = 6;               // 以下为作业级汇总，含义见指标目录
  int64 rows_read = 7;
  int64 rows_written = 8;
  int64 rows_filtered = 9;
  int64 rows_expanded = 10;
  int64 rows_failed = 11;
  int64 rows_in_flight = 12;
  double read_rows_per_second = 13;
  double write_rows_per_second = 14;
  int64 reader_wait_ms = 15;
  int64 writer_wait_ms = 16;
  int64 back_pressured_ms = 17;
  int64 exchanged_bytes = 18;
  int32 queue_depth = 19;
  int32 queue_capacity = 20;
  int32 tasks_running = 21;
  int32 parallelism = 22;
  int64 memory_bytes = 23;            // Task 当前记账的内存之和
  int64 rows_dirty = 24;              // 跳过的坏行
  repeated DirtySample dirty_samples = 25;  // 作业最先跳过的坏行，最多 20 条
  int64 throttle_wait_ms = 26;        // Task 等待限流配额的时间之和
}

message ListJobsRequest {
  Header header = 1;
  repeated RunState states = 2;       // 空表示全部
  int32 limit = 3;
  string page_token = 4;
}

message ListJobsResponse {
  repeated JobStatus jobs = 1;
  string next_page_token = 2;
}

message ExplainResult {
  string schema_version = 1;
  string json = 2;                    // 与 REST 运行分析接口相同的 JSON（见 29 章）
}

// 读取一个 Task 的日志：字段与 ReadLogRequest 相同，Master 按 run_id 找到 Task 所在的 Worker 后转发
message ReadTaskLogRequest {
  Header header = 1;
  string run_id = 2;
  ExecutionAttemptId task = 3;
  int64 offset = 4;                   // 负数表示从末尾往前
  int64 max_bytes = 5;                // 0 表示 64KB
  string contains = 6;                // 关键字过滤，空表示不过滤
  string min_level = 7;               // TRACE / DEBUG / INFO / WARN / ERROR
  bool follow = 8;                    // Task 运行中时持续推送
}

enum SplitState {
  SPLIT_STATE_UNSPECIFIED = 0;
  SPLIT_STATE_ASSIGNED = 1;           // 已分配给读取器，正在读或排队
  SPLIT_STATE_FINISHED = 2;           // 读取器已结束：分片已读完
}

message SplitInfo {
  string node_id = 1;                 // Source 节点
  string split_id = 2;
  int32 subtask = 3;                  // 读取它的读取器
  SplitState state = 4;
}

message ListSplitsResponse {
  repeated SplitInfo splits = 1;      // 按读取器、分片 ID 排序；尚未分配的分片不在其中
}

// 集群的状态：Master 与已注册的 Worker（Slot、标签、资源、心跳）
message ClusterRequest {
  Header header = 1;
}

message WorkerInfo {
  string worker_id = 1;
  string engine_version = 2;
  string rpc_address = 3;
  string data_address = 4;
  ResourceProfile resources = 5;
  map<string, string> labels = 6;
  string resource_group = 7;
  repeated SlotStatus slots = 8;
  int32 tasks_running = 9;
  int64 since_heartbeat_ms = 10;      // 距离最近一次心跳的时间
}

message ClusterStatus {
  string engine_version = 1;          // Master 的版本
  string protocol_version = 2;
  int64 started_ms = 3;               // Master 启动的时间
  repeated WorkerInfo workers = 4;    // 按注册顺序
}
