#
# The metrics the engine reports. The metrics reference of the documentation site is generated
# from this file; MetricCatalogTest checks that every field of JobMetrics, NodeMetrics and Rate
# is listed here.
#
#   name:        lower camel case, as in the JSON output
#   scope:       job | node
#   type:        counter | gauge | meter | timer
#   unit:        rows | ms | rows/s | ratio | bytes | batches | splits | tasks

- name: elapsedMs
  scope: job
  type: gauge
  unit: ms
  description:
    en-US: "Time since the job was submitted, until it ended."
    zh-CN: "作业提交以来经过的时间，作业结束后定格。"

- name: rowsRead
  scope: job
  type: counter
  unit: rows
  description:
    en-US: "Rows emitted by the sources."
    zh-CN: "Source 输出的行数。"

- name: rowsWritten
  scope: job
  type: counter
  unit: rows
  description:
    en-US: "Rows written by the sinks. For sinks that commit in two phases, the rows committed once the job has finished."
    zh-CN: "Sink 写入的行数。两阶段提交的 Sink 在作业结束、提交成功后才计入。"

- name: rowsFiltered
  scope: job
  type: counter
  unit: rows
  description:
    en-US: "Rows that transforms dropped: the transform emitted nothing for them."
    zh-CN: "被 Transform 丢弃的行数：Transform 没有为这些行输出任何行。"

- name: rowsExpanded
  scope: job
  type: counter
  unit: rows
  description:
    en-US: "Extra rows that transforms emitted when one input row became several."
    zh-CN: "Transform 把一行变成多行时多出的行数。"

- name: rowsFailed
  scope: job
  type: counter
  unit: rows
  description:
    en-US: "Rows read but not written when the job failed or was cancelled."
    zh-CN: "作业失败或被取消时，已读取但未写入的行数。"

- name: rowsInFlight
  scope: job
  type: gauge
  unit: rows
  description:
    en-US: "Rows read but not yet written, for example waiting in the write queue. 0 once the job has ended."
    zh-CN: "已读取但尚未写入的行数，例如在写队列中等待的行。作业结束后为 0。"

- name: readRowsPerSecond
  scope: job
  type: meter
  unit: rows/s
  description:
    en-US: "Read rate: current (last 5 seconds), average since the start and peak over one second."
    zh-CN: "读取速率：瞬时值（最近 5 秒）、全程平均值和 1 秒内的峰值。"

- name: writeRowsPerSecond
  scope: job
  type: meter
  unit: rows/s
  description:
    en-US: "Write rate: current (last 5 seconds), average since the start and peak over one second."
    zh-CN: "写入速率：瞬时值（最近 5 秒）、全程平均值和 1 秒内的峰值。"

- name: readerWaitMs
  scope: job
  type: timer
  unit: ms
  description:
    en-US: "Time tasks blocked on a full write queue, summed over tasks. High values mean the target is the bottleneck."
    zh-CN: "Task 因写队列已满而阻塞的时间，按 Task 求和。数值高说明瓶颈在目标端。"

- name: writerWaitMs
  scope: job
  type: timer
  unit: ms
  description:
    en-US: "Time write threads waited for rows on an empty queue, summed over tasks. High values mean the source is the bottleneck."
    zh-CN: "写线程在空队列上等待数据的时间，按 Task 求和。数值高说明瓶颈在源端。"

- name: parallelism
  scope: job
  type: gauge
  unit: tasks
  description:
    en-US: "The number of tasks of the job."
    zh-CN: "作业的 Task 数。"

- name: tasksRunning
  scope: job
  type: gauge
  unit: tasks
  description:
    en-US: "The tasks that are running now."
    zh-CN: "当前正在运行的 Task 数。"

- name: exchangedBytes
  scope: job
  type: counter
  unit: bytes
  description:
    en-US: "Bytes of rows tasks sent to other tasks, in memory on one worker or over the network between workers."
    zh-CN: "Task 发给其他 Task 的行的字节数，包括同一 Worker 上的内存交换和 Worker 之间的网络交换。"

- name: backpressuredMs
  scope: job
  type: timer
  unit: ms
  description:
    en-US: "Time tasks waited for network buffers, summed over tasks. High values mean something downstream is slower."
    zh-CN: "Task 等待网络缓冲的时间，按 Task 求和。数值高说明下游更慢。"

- name: backpressuredRatio
  scope: job
  type: gauge
  unit: ratio
  description:
    en-US: "backpressuredMs as a share of the running time of the tasks, from 0 to 1; -1 before any task ran."
    zh-CN: "backpressuredMs 占 Task 运行时间的比例，从 0 到 1；还没有 Task 运行时为 -1。"

- name: queueDepth
  scope: job
  type: gauge
  unit: batches
  description:
    en-US: "Batches in the write queues of the sinks now; close to queueCapacity means the target is the bottleneck."
    zh-CN: "Sink 写队列中当前的批数；接近 queueCapacity 说明瓶颈在目标端。"

- name: queueCapacity
  scope: job
  type: gauge
  unit: batches
  description:
    en-US: "The batches the write queues of the sinks hold, summed over tasks; 0 without write buffers."
    zh-CN: "Sink 写队列能容纳的批数，按 Task 求和；没有写缓冲时为 0。"

- name: splitsAssigned
  scope: job
  type: counter
  unit: splits
  description:
    en-US: "Splits the enumerator gave to readers."
    zh-CN: "分片分配器分给 Reader 的分片数。"

- name: splitsFinished
  scope: job
  type: counter
  unit: splits
  description:
    en-US: "Splits of readers that have finished. Readers do not report single splits, so this grows when a reader ends."
    zh-CN: "已经结束的 Reader 的分片数。Reader 不会单独报告每个分片，因此这个值在 Reader 结束时增长。"

- name: rowsIn
  scope: node
  type: counter
  unit: rows
  description:
    en-US: "Rows the node received, summed over its tasks; for a source, the rows it read."
    zh-CN: "节点收到的行数，按 Task 求和；对 Source 而言是读取的行数。"

- name: rowsOut
  scope: node
  type: counter
  unit: rows
  description:
    en-US: "Rows the node emitted, summed over its tasks; for a sink, the rows it wrote."
    zh-CN: "节点输出的行数，按 Task 求和；对 Sink 而言是写入的行数。"

- name: rowsFiltered
  scope: node
  type: counter
  unit: rows
  description:
    en-US: "Rows a transform dropped."
    zh-CN: "Transform 丢弃的行数。"

- name: rowsExpanded
  scope: node
  type: counter
  unit: rows
  description:
    en-US: "Extra rows a transform emitted when one row became several."
    zh-CN: "Transform 把一行变成多行时多出的行数。"

- name: selfTimeRatio
  scope: node
  type: gauge
  unit: ratio
  description:
    en-US: "Share of the running time spent in the node's own code, without the nodes after it (0 to 1). Sampled on every 16th read; for a sink with the write buffer, the busy time of its write thread."
    zh-CN: "节点自身代码占运行时间的比例（0 到 1），不含其下游节点。每 16 次读取采样一次；开启写缓冲的 Sink 取写线程的忙碌时间。"

- name: bytesIn
  scope: node
  type: counter
  unit: bytes
  description:
    en-US: "Bytes of rows the node received from other tasks; 0 for a node that does not read from another task."
    zh-CN: "节点从其他 Task 收到的行的字节数；不从其他 Task 读取的节点为 0。"

- name: bytesOut
  scope: node
  type: counter
  unit: bytes
  description:
    en-US: "Bytes of rows the node sent to other tasks; 0 for a node that does not write to another task."
    zh-CN: "节点发给其他 Task 的行的字节数；不向其他 Task 写入的节点为 0。"
