# The settings of the master process (bin/pipeforge-master.sh).
# Every setting can also be given as an environment variable, e.g. PIPEFORGE_WORKER_SLOTS for
# worker.slots, or on the command line with --set key=value. Remove the # to change a setting;
# the configuration reference of the documentation lists them all.

# The port of the master's RPC: workers register here, tasks report here, jobs are submitted here.
# master.rpc.port: 6123

# The working directory of the master: extracted plugins and the packages it serves to workers.
# master.dir: data/master

# How often workers send a heartbeat; the master checks for lost workers as often.
# master.heartbeat.interval: 5s

# After how long without a heartbeat a worker counts as lost and its tasks fail.
# master.heartbeat.timeout: 30s

# spread puts the slots of a job on as many workers as possible, pack on as few as possible.
# scheduler.strategy: spread

# How long a job waits for free slots before it fails with PF-RES-0001.
# scheduler.slot-request-timeout: 5min

# How long a cancelled task may take to stop before its thread is interrupted; the default of the jobs this master runs.
# task.cancel-timeout: 30s

# The metastore the server uses, where the master records checkpoints; required with checkpoint.dir.
# The server creates its tables, so start a server of this version on it first. H2 and PostgreSQL
# drivers ship; for MySQL put Connector/J into driver-dir.
# master.metastore.url: jdbc:postgresql://db:5432/pipeforge
# master.metastore.username:
# master.metastore.password:
# master.metastore.driver-dir:
# master.metastore.pool-size: 4
