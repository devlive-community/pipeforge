# The settings of the whole cluster, read by the master and the workers.
# Every setting can also be given as an environment variable, e.g. PIPEFORGE_WORKER_SLOTS for
# worker.slots, or on the command line with --set key=value. Remove the # to change a setting;
# the configuration reference of the documentation lists them all.

# The name of the cluster, shown in the logs; the masters of one cluster compete for its leader lease in the metastore.
# cluster.name: default

# The shared token every process presents to the others; processes with another token are refused.
# Use a long random value and keep it secret.
# Required: the processes do not start without it.
# cluster.token: <a long random secret>

# Encrypt the RPC between the processes with TLS; the key store and the trust store are then
# required.
# security.tls.enabled: false

# The PKCS#12 key store with the certificate this process presents.
# security.tls.key-store:

# The password of the key store.
# security.tls.key-store-password: ""

# The PKCS#12 trust store with the certificates of the other processes.
# security.tls.trust-store:

# The password of the trust store.
# security.tls.trust-store-password: ""

# Where checkpoints are kept, the same for every master and worker: a directory (on NFS, mounted
# at the same path on every machine) or s3://bucket/prefix. Each process checks at its start that
# it can write, read and delete there. Without it, runs keep no checkpoints.
# checkpoint.dir: /data/pipeforge/checkpoints

# S3-compatible storage (OSS, COS, MinIO): the endpoint, and usually path-style addressing. With
# AWS S3 leave the endpoint empty. Without keys, the AWS default credentials are used.
# checkpoint.s3.endpoint:
# checkpoint.s3.region: us-east-1
# checkpoint.s3.path-style: false
# checkpoint.s3.access-key:
# checkpoint.s3.secret-key:

# The directories with plugin packages, relative to the installation directory. The master plans
# jobs with them and serves them to the workers.
# plugins.dirs: plugins
