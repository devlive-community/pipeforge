# The settings of the worker processes (bin/pipeforge-worker.sh).
# Every setting can also be given as an environment variable, e.g. PIPEFORGE_WORKER_SLOTS for
# worker.slots, or on the command line with --set key=value. Remove the # to change a setting;
# the configuration reference of the documentation lists them all.

# Where the worker finds the master.
# worker.master.address: localhost:6123

# The host name or address other processes reach this worker at.
# worker.host:   # default: the host name of this machine

# The port the master deploys and cancels tasks on.
# worker.rpc.port: 6125

# The port tasks on other workers read the rows of this worker's tasks from.
# worker.data.port: 6124

# How many tasks the worker runs at the same time.
# worker.slots:   # default: the number of processors

# Key and value pairs jobs can require, such as zone=east or net=db-zone.
# worker.labels: ""

# The resource group the worker belongs to.
# worker.resource-group: default

# The working directory of the worker: the plugin packages it downloaded from the master.
# worker.dir: data/worker

# Where tasks write their own logs, relative to the installation directory: <job>/<run>/<vertex>-<subtask>-<attempt>.log.
# worker.log.dir: logs/tasks

# The size at which a task log file is rolled; offsets in the log stay the same.
# worker.log.max-file-size: 64MB

# How many files of one task log are kept, the current one included; older ones are deleted.
# worker.log.max-files: 5

# How long the task logs of a run are kept after their last write; the worker checks every hour.
# worker.log.retention: 7d

# How often a worker that is not connected tries to register.
# worker.registration-retry: 1s

# The memory for network buffers of the data exchange.
# worker.memory.network:   # default: 10% of the maximum heap, at least 64MB and at most 1GB

# How long after a cancel a task that ignores cancel and interrupt is given up: it fails with PF-RES-0005 and its thread is reported as left behind.
# task.cancel-kill-timeout: 3min

# The memory one task may hold in rows waiting for its sink; its reader waits when they reach it.
# worker.memory.task:   # default: half of the heap left after the network memory, split over the slots, at least 16MB

# Whether the heap guard slows down, and at last fails, the run that holds the most memory when the heap of the worker runs full.
# worker.heap-guard.enabled: true

# The heap use, in percent of the maximum heap, at which the sources of the run holding the most memory stop reading until it is lower again.
# worker.heap-guard.pause-percent: 85

# The heap use, in percent of the maximum heap, that fails the tasks of the run holding the most memory with PF-RES-0002 once it lasted worker.heap-guard.fail-after.
# worker.heap-guard.fail-percent: 92

# How long the heap must stay at worker.heap-guard.fail-percent before a run fails.
# worker.heap-guard.fail-after: 10s

# How long after a run ended the class loaders of its plugins may take to be collected; one still reachable then, and after a garbage collection, is logged as leaked with what holds it.
# worker.class-loader-leak-timeout: 1min

# The size of a network buffer.
# network.buffer-size: 32KB

# The buffers each input channel owns.
# network.buffers-per-channel: 2

# The buffers an input shares among its channels when producers report a backlog.
# network.floating-buffers-per-gate: 8

# After how long a buffer that is not full is sent anyway.
# network.buffer-timeout: 100ms

# The largest row a task takes, estimated in memory, and the largest it exchanges with another task; a larger row fails its job with PF-DATA-0007.
# task.max-row-bytes: 64MB
