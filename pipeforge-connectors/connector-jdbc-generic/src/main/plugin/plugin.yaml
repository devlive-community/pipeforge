id: jdbc
name: JDBC
version: 0.1.0-SNAPSHOT
api-version: "0.x"
vendor: PipeForge
license: MIT
description: Reads and writes tables of any database with a JDBC driver, with ANSI SQL; reads many at once in parallel splits, writes in batches. Users install the driver as a driver plugin.
provides:
  - { type: source, identifier: jdbc, class: org.devlive.pipeforge.connector.jdbc.generic.JdbcGenericSourceFactory }
  - { type: sink, identifier: jdbc, class: org.devlive.pipeforge.connector.jdbc.generic.JdbcGenericSinkFactory }
# verified with H2; other databases work as far as they follow ANSI SQL
datasource:
  type: h2
  versions: ["2.2"]
requires:
  drivers: any
skipped-testkit-groups:
  - { group: checkpoint, reason: "a restored reader reads its splits from the start again; key-based resume is not implemented yet" }
  - { group: state-compat, reason: "the reader state is not kept compatible before key-based resume" }
