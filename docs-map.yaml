# Code paths and the documentation pages that describe them (see the docs guide on the
# documentation site). A feat / perf / breaking commit that changes a mapped path must also
# change every listed page, in English and Chinese, or explain "Docs-Not-Needed: <reason>".
# Every new module must be registered here.
#
#   - paths: ["<glob>", ...]     repository-relative globs
#     docs: ["<page>", ...]      page ids relative to docs/content/<lang>/, without extension
#
# Entries are added together with the code they describe.

- paths: ["dev/**"]
  docs: ["development/local-environment"]
- paths: ["docs/app/**", "docs/components/**", "docs/lib/**", "docs/styles/**", "docs/scripts/**"]
  docs: ["development/docs-guide"]
- paths: ["pipeforge-design-tokens/**"]
  docs: ["development/docs-guide"]
# The error framework. New codes (ErrorCode constants and errors/*.yaml) only feed the generated
# reference/errors page and need no hand edits.
- paths:
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/PipeForgeException.java"
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/ErrorRegistry.java"
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/ErrorDefinition.java"
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/ErrorInfo.java"
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/ErrorScope.java"
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/ErrorKind.java"
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/ErrorCategory.java"
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/MessageTemplate.java"
  docs: ["concepts/errors"]
- paths: ["pipeforge-common/src/main/java/org/devlive/pipeforge/common/plugin/**"]
  docs: ["development/plugin-packaging"]
- paths: ["pipeforge-api/**"]
  docs: ["development/api-overview"]
- paths: ["pipeforge-api/src/main/java/org/devlive/pipeforge/api/row/**", "pipeforge-api/src/main/java/org/devlive/pipeforge/api/type/**", "pipeforge-api/src/main/java/org/devlive/pipeforge/api/table/**"]
  docs: ["concepts/data-model"]
- paths: ["pipeforge-maven-plugin/**"]
  docs: ["development/plugin-packaging"]
- paths: ["pipeforge-plugin/**"]
  docs: ["concepts/plugins"]
- paths: ["pipeforge-expressions/**"]
  docs: ["concepts/expressions", "reference/expression-syntax"]
- paths: ["pipeforge-core/src/main/java/org/devlive/pipeforge/core/job/**"]
  docs: ["reference/job-dsl"]
- paths: ["pipeforge-core/src/main/java/org/devlive/pipeforge/core/variable/**"]
  docs: ["reference/variables"]
- paths: ["pipeforge-core/src/main/java/org/devlive/pipeforge/core/plan/**", "pipeforge-core/src/main/java/org/devlive/pipeforge/core/explain/**"]
  docs: ["concepts/plan-and-explain"]
- paths: ["pipeforge-server/**"]
  docs: ["reference/api", "operations/server"]
- paths: ["pipeforge-client-ts/**"]
  docs: ["reference/api"]
