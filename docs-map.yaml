# Code paths and the documentation pages that describe them (see the docs guide on the
# documentation site). A feat / perf / breaking commit that changes a mapped path must also
# change every listed page, in English and Chinese, or explain "Docs-Not-Needed: <reason>".
# Every new module must be registered here.
#
#   - paths: ["<glob>", ...]     repository-relative globs
#     docs: ["<page>", ...]      page ids relative to docs/content/<lang>/, without extension
#
# Entries are added together with the code they describe.

- paths: ["examples/**"]
  docs: ["getting-started/quickstart"]
- paths: ["dev/**"]
  docs: ["development/local-environment"]
- paths: ["docs/app/**", "docs/components/**", "docs/lib/**", "docs/styles/**", "docs/scripts/**"]
  docs: ["development/docs-guide"]
- paths: ["pipeforge-design-tokens/**"]
  docs: ["development/docs-guide"]
# The error framework. New codes (ErrorCode constants and errors/*.yaml) only feed the generated
# reference/errors page and need no hand edits.
- paths:
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/PipeForgeException.java"
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/ErrorRegistry.java"
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/ErrorDefinition.java"
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/ErrorInfo.java"
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/ErrorScope.java"
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/ErrorKind.java"
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/ErrorCategory.java"
    - "pipeforge-common/src/main/java/org/devlive/pipeforge/common/error/MessageTemplate.java"
  docs: ["concepts/errors"]
- paths: ["pipeforge-common/src/main/java/org/devlive/pipeforge/common/plugin/**"]
  docs: ["development/plugin-packaging"]
- paths: ["pipeforge-api/**"]
  docs: ["development/api-overview"]
- paths: ["pipeforge-api/src/main/java/org/devlive/pipeforge/api/row/**", "pipeforge-api/src/main/java/org/devlive/pipeforge/api/type/**", "pipeforge-api/src/main/java/org/devlive/pipeforge/api/table/**"]
  docs: ["concepts/data-model"]
- paths: ["pipeforge-maven-plugin/**"]
  docs: ["development/plugin-packaging"]
- paths: ["pipeforge-plugin/**"]
  docs: ["concepts/plugins"]
- paths: ["pipeforge-expressions/**"]
  docs: ["concepts/expressions", "reference/expression-syntax"]
- paths: ["pipeforge-core/src/main/java/org/devlive/pipeforge/core/dirty/**", "pipeforge-engine/engine-worker/src/main/java/org/devlive/pipeforge/engine/worker/DirtyRows.java", "pipeforge-api/src/main/java/org/devlive/pipeforge/api/row/BadRowException.java"]
  docs: ["concepts/dirty-data"]
- paths: ["pipeforge-core/src/main/java/org/devlive/pipeforge/core/job/**"]
  docs: ["reference/job-dsl"]
- paths: ["pipeforge-core/src/main/java/org/devlive/pipeforge/core/variable/**"]
  docs: ["reference/variables"]
- paths: ["pipeforge-core/src/main/java/org/devlive/pipeforge/core/plan/**", "pipeforge-core/src/main/java/org/devlive/pipeforge/core/explain/**"]
  docs: ["concepts/plan-and-explain"]
- paths: ["pipeforge-core/src/main/java/org/devlive/pipeforge/core/expression/**"]
  docs: ["development/api-overview", "concepts/expressions"]
# The native engine. In local mode the runtime is described by the execution concept page; the
# protocol between master, workers and server (engine-rpc) by the engine protocol page. New engine
# modules register their own entry; pipeforge-engine/pom.xml only lists the modules.
- paths: ["pipeforge-engine/engine-api/**", "pipeforge-engine/engine-worker/**", "pipeforge-engine/engine-local/**", "pipeforge-engine/engine-network/src/main/java/org/devlive/pipeforge/engine/network/*.java", "pipeforge-engine/engine-network/src/main/java/org/devlive/pipeforge/engine/network/buffer/**", "pipeforge-engine/engine-network/src/main/java/org/devlive/pipeforge/engine/network/partition/**", "pipeforge-engine/engine-network/src/main/java/org/devlive/pipeforge/engine/network/gate/**"]
  docs: ["concepts/execution"]
- paths: ["pipeforge-engine/engine-api/src/main/java/org/devlive/pipeforge/engine/api/RunAnaly*.java", "pipeforge-engine/engine-api/src/main/java/org/devlive/pipeforge/engine/api/Bottleneck.java", "pipeforge-engine/engine-api/src/main/java/org/devlive/pipeforge/engine/api/AnalyzeText.java"]
  docs: ["concepts/plan-and-explain"]
- paths: ["pipeforge-engine/engine-rpc/**", "pipeforge-engine/engine-network/**", "pipeforge-engine/protocol-compat/**"]
  docs: ["development/engine-protocol"]
- paths: ["pipeforge-engine/engine-master/src/main/java/org/devlive/pipeforge/engine/master/ResourceManager*.java", "pipeforge-engine/engine-master/src/main/java/org/devlive/pipeforge/engine/master/Scheduler.java", "pipeforge-engine/engine-worker/src/main/java/org/devlive/pipeforge/engine/worker/SlotTable.java", "pipeforge-engine/engine-worker/src/main/java/org/devlive/pipeforge/engine/worker/MasterConnection.java", "pipeforge-engine/engine-worker/src/main/java/org/devlive/pipeforge/engine/worker/PluginCache.java", "pipeforge-engine/engine-master/src/main/java/org/devlive/pipeforge/engine/master/PluginBlobs.java"]
  docs: ["concepts/cluster"]
- paths: ["pipeforge-engine/engine-master/src/main/java/org/devlive/pipeforge/engine/master/graph/**", "pipeforge-engine/engine-master/src/main/java/org/devlive/pipeforge/engine/master/JobMaster*.java", "pipeforge-engine/engine-master/src/main/java/org/devlive/pipeforge/engine/master/Placement.java", "pipeforge-engine/engine-master/src/main/java/org/devlive/pipeforge/engine/master/ChainTopology.java", "pipeforge-engine/engine-master/src/main/java/org/devlive/pipeforge/engine/master/MetricsAggregator.java", "pipeforge-engine/engine-master/src/main/java/org/devlive/pipeforge/engine/master/Dispatcher*.java", "pipeforge-engine/engine-master/src/main/java/org/devlive/pipeforge/engine/master/RunStates.java", "pipeforge-engine/engine-master/src/main/java/org/devlive/pipeforge/engine/master/PluginPlanning.java"]
  docs: ["concepts/execution"]
- paths: ["pipeforge-connectors/connector-jdbc/**"]
  docs: ["development/jdbc-dialects"]
