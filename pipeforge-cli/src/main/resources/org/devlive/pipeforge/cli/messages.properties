exit.0 = Success.
exit.1 = An error, such as a server that did not start, or an unexpected error.
exit.2 = The command was used wrongly: an unknown option, a missing argument or a malformed value.
exit.3 = A job, an option or an expression is invalid.
exit.4 = The run failed.
exit.5 = The run was cancelled after --timeout.
exit.6 = A file or an object does not exist.
exit.7 = Authentication failed or a permission is missing (with a server, in a later version).
exit.8 = The run was cancelled.
exit.9 = The run succeeded, but its row counters do not reconcile.

