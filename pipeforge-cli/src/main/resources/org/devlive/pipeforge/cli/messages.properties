# Texts of the pipeforge command in English. Help texts (descriptions) are shown as they are;
# messages are MessageFormat patterns, so an apostrophe in them is written twice.

usage.description = Validate, explain and run PipeForge jobs on this machine, evaluate expressions and start the Web UI.
usage.synopsisHeading = Usage: 
usage.commandListHeading = %nCommands:%n
usage.optionListHeading = %nOptions:%n
usage.parameterListHeading = %nArguments:%n
mixinStandardHelpOptions.help = Show this help and exit.
mixinStandardHelpOptions.version = Show the version and exit.

pipeforge.validate.usage.description = Check job files without running them: syntax, variables, plugins, options, graph and schemas.
pipeforge.explain.usage.description = Show the plan of a job: settings, variables, nodes, options with their origin, schemas and warnings.
pipeforge.run.usage.description = Run a job file on this machine and wait until it ends. Ctrl-C cancels it.
pipeforge.expr.usage.description = Work with the expression language.
pipeforge.expr.eval.usage.description = Evaluate an expression on one row and show the result and its type.
pipeforge.ui.usage.description = Start the server on 127.0.0.1 with the plugins of this command and open the Web UI. Ctrl-C stops it.
pipeforge.version.usage.description = Show the versions of the command, the connector API and Java.
pipeforge.doctor.usage.description = Check this machine: Java, the installation, plugins, the server, Docker and the terminal encoding.
pipeforge.plugin.usage.description = Check, test and document plugins while they are developed.
pipeforge.plugin.validate.usage.description = Check built plugin packages the way the engine uses them: descriptor, isolation, forbidden calls, components and documentation data.
pipeforge.plugin.test.usage.description = Run the tests of a plugin project with Maven, the testkit contract among them.
pipeforge.plugin.docs.usage.description = Write the documentation data of a plugin project with Maven and show the options of its components, or check that it is current.
pipeforge.dev.usage.description = Start, stop and show the local development environment: the docker compose project in dev/ with databases ready for CDC, a fault-injection proxy and monitoring.
pipeforge.dev.up.usage.description = Start the development environment and wait until every service is healthy, then show its status.
pipeforge.dev.down.usage.description = Stop the development environment, the optional services included.
pipeforge.dev.status.usage.description = Show the state, health and ports of every service; exits with 1 when nothing runs or a service is not healthy.
pipeforge.completion.usage.description = Print the completion script of a shell; load it with source <(pipeforge completion bash).

option.output = Output format: table (default), json or yaml. json and yaml have the fields of the REST API.
option.lang = Language of messages and errors: en-US or zh-CN. Defaults to PIPEFORGE_LANG, then the system language.
option.no-color = Never use colours; also when NO_COLOR is set or the output is not a terminal.
option.quiet = Print results only, no progress or notes.
option.verbose = Print engine and plugin logs and the full cause of errors.
option.plugin-path = Directory with plugin packages; repeat it or separate directories with the path separator. Defaults to PIPEFORGE_PLUGIN_PATH, then plugins/ of the installation.
option.dev = Also load the plugin modules of the source checkout at <root>, or of the one around the current directory, from their build output.
option.var = A job variable, as name=value; repeat it for more. Wins over env.variables of the job.
option.scheduled-time = The planned time of the run, the base of ${date:...}, as an ISO-8601 time such as 2026-11-07T00:00:00Z. Defaults to now.

validate.files = Job files, or directories whose .yaml, .yml and .json files are checked.
explain.file = The job file.
run.file = The job file.
run.local = Run in this process. Required in this version; running on a cluster comes with the distributed runtime.
run.dry-run = Plan the job and print its plan, without running it.
run.analyze = After the run, print the run analysis: nodes, rates, wait times and the reconciliation.
run.timeout = Cancel the run after this time, e.g. 30s, 10m or 2h, and exit with 5.
expr.expression = The expression, in quotes.
expr.row = The row as a JSON object, e.g. {"amount": 1200, "city": "Hangzhou"}.
expr.column = The type of a column, as name TYPE, e.g. "amount DECIMAL(10, 2)"; columns without one get the type of their JSON value.
expr.timezone = The time zone of dates and times.
ui.port = The port of the server.
ui.no-browser = Do not open the browser.
ui.server-jar = The server jar to start, instead of the one of the installation.
ui.start-timeout = How many seconds the server may take to start.
completion.shell = bash or zsh.
dev.dir = The directory of the environment, with its docker-compose.yaml. Defaults to dev/ of the source checkout around the current directory, then dev/ of the installation.
dev.up.services = Start only these services and what they depend on, e.g. mysql. Defaults to all services.
dev.up.s3 = Also start the services of the s3 profile: MinIO with its buckets.
dev.up.timeout = How long to wait for the services to become healthy, e.g. 90s or 5m.
dev.down.volumes = Also delete the data volumes; the sample data is created again on the next start.
plugin.validate.packages = Plugin packages: zip files, or directories they were extracted to.
plugin.project = The plugin project: a directory with pom.xml and src/main/plugin/plugin.yaml.
plugin.test.groups = Only these testkit groups, separated by commas, e.g. options,types; the others are skipped.
plugin.test.test = Only the test classes that match, as Maven's -Dtest, e.g. *ContractTest.
plugin.maven = The Maven command to use; defaults to the nearest mvnw of the project, else mvn.
plugin.docs.output-dir = Where the documentation data is written; defaults to src/generated/plugin-docs of the project.
plugin.docs.check = Compare the documentation data with what the components export instead of writing it; exit with 3 when it is stale.

