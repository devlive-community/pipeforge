expr.bad-type = ''{0}'' 不是类型（列 {1}）
expr.bad-row = --row 不是 JSON 对象：{0}
expr.bad-value = 列 {0} 的值不是 {1}：{2}
expr.value = 值
expr.type = 类型
ui.starting = 正在为 {0} 启动服务端（日志：{1}）……
ui.ready = Web UI 地址：{0}；按 Ctrl-C 停止服务端。
ui.stopped = 服务端已结束，退出码 {0}。
ui.exited = 进程以退出码 {0} 结束
ui.no-answer = {0} 秒内没有响应
ui.open-yourself = 请在浏览器中打开 {0}。
version.api = 连接器 API
doctor.java-old = {0}：PipeForge 需要 Java 21 或更高版本
doctor.no-home = 不是从安装目录启动的（bin/pipeforge）；插件来自 --plugin-path、PIPEFORGE_PLUGIN_PATH 或 ./plugins
doctor.plugins = {1} 中有 {0} 个插件
doctor.no-directory = {0} 不存在
doctor.no-plugins = 没有找到插件，无法生成作业计划。请使用安装目录、--plugin-path 或 --dev
doctor.no-server = 没有服务端 jar；pipeforge ui 需要完整包或 --server-jar
doctor.no-docker = Docker 不可用；只有开发环境需要它
doctor.encoding = 终端使用 {0}；请设为 UTF-8，中文等文字才能正确显示

plugin.no-project = 不是插件工程；需要 pom.xml 和 src/main/plugin/plugin.yaml
plugin.running = 正在运行 {0}
plugin.no-maven = 无法启动 Maven（{0}）；请安装 Maven 或使用 --maven
plugin.component = {0} {1}，能力：{2}
plugin.validate.summary = {0} 个插件包通过，{1} 个未通过
plugin.test.passed = 测试通过：运行 {0} 个，失败 {1} 个，错误 {2} 个，跳过 {3} 个
plugin.test.failed = 测试未通过：运行 {0} 个，失败 {1} 个，错误 {2} 个，跳过 {3} 个；见上面的 Maven 输出
plugin.docs.written = 已写入 {0}
plugin.docs.current = {0} 是最新的
plugin.docs.stale = 文档数据已过期，或者工程无法构建；见上面的 Maven 输出。
plugin.docs.failed = 工程无法构建；见上面的 Maven 输出。

exit.0 = 成功。
exit.1 = 错误，例如服务端没有启动，或者意外错误。
exit.2 = 命令用法有误：未知选项、缺少参数或取值格式不对。
exit.3 = 作业、选项或表达式不合法。
exit.4 = 运行失败。
exit.5 = 运行因 --timeout 超时被取消。
exit.6 = 文件或对象不存在。
exit.7 = 认证失败或缺少权限（连接服务端时，后续版本提供）。
exit.8 = 运行被取消。
exit.9 = 运行成功，但行数计数不能对账。

dev.not-environment = 这里没有 PipeForge 开发环境的 docker-compose.yaml
dev.not-found = {0} 及其上级目录和安装目录中都没有 PipeForge 开发环境的 dev/docker-compose.yaml；请使用 --dir
dev.no-docker = docker version 没有响应；Docker 没有安装或没有运行
dev.no-compose = docker compose version 没有响应；没有安装 Compose v2
dev.running = 正在运行 {0}
dev.environment = 开发环境：{0}
dev.not-running = 没有运行；用 pipeforge dev up 启动。
dev.healthy = {0} 个服务，全部健康
dev.unhealthy = {1} 个服务中有 {0} 个不健康：{2}
dev.stopped = 已停止 {0} 中的开发环境
dev.stopped-volumes = 已停止 {0} 中的开发环境并删除了数据卷
