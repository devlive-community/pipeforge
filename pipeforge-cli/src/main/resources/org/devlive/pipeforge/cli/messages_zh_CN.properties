# Texts of the pipeforge command in Chinese; the keys are those of messages.properties.

usage.description = 在本机校验、解释和运行 PipeForge 作业，计算表达式，启动 Web UI。
usage.synopsisHeading = 用法：
usage.commandListHeading = %n命令：%n
usage.optionListHeading = %n选项：%n
usage.parameterListHeading = %n参数：%n
mixinStandardHelpOptions.help = 显示帮助并退出。
mixinStandardHelpOptions.version = 显示版本并退出。

pipeforge.validate.usage.description = 校验作业文件但不运行：语法、变量、插件、选项、图和 Schema。
pipeforge.explain.usage.description = 显示作业的计划：设置、变量、节点、带来源的选项、Schema 和警告。
pipeforge.run.usage.description = 在本机运行作业文件并等待它结束。按 Ctrl-C 取消。
pipeforge.expr.usage.description = 使用表达式语言。
pipeforge.expr.eval.usage.description = 用一行数据计算表达式，显示结果和结果类型。
pipeforge.ui.usage.description = 在 127.0.0.1 上用本命令的插件启动服务端，并打开 Web UI。按 Ctrl-C 停止。
pipeforge.version.usage.description = 显示命令、连接器 API 和 Java 的版本。
pipeforge.doctor.usage.description = 检查本机环境：Java、安装目录、插件、服务端、Docker 和终端编码。
pipeforge.plugin.usage.description = 在开发过程中校验、测试插件并生成文档数据。
pipeforge.plugin.validate.usage.description = 按引擎使用插件的方式检查构建好的插件包：描述文件、隔离、禁止调用、组件和文档数据。
pipeforge.plugin.test.usage.description = 用 Maven 运行插件工程的测试，包括 testkit 契约测试。
pipeforge.plugin.docs.usage.description = 用 Maven 生成插件工程的文档数据并显示各组件的选项，或者检查文档数据是否最新。
pipeforge.dev.usage.description = 启动、停止和查看本地开发环境：dev/ 中的 docker compose 工程，包括已为 CDC 准备好的数据库、故障注入代理和监控。
pipeforge.dev.up.usage.description = 启动开发环境，等待所有服务健康后显示其状态。
pipeforge.dev.down.usage.description = 停止开发环境，包括可选服务。
pipeforge.dev.status.usage.description = 显示每个服务的状态、健康情况和端口；没有服务运行或有服务不健康时以 1 退出。
pipeforge.completion.usage.description = 输出 Shell 的补全脚本；用 source <(pipeforge completion bash) 加载。

option.output = 输出格式：table（默认）、json 或 yaml。json 和 yaml 的字段与 REST API 一致。
option.lang = 提示和错误的语言：en-US 或 zh-CN。默认取 PIPEFORGE_LANG，其次是系统语言。
option.no-color = 不使用颜色；设置了 NO_COLOR 或输出不是终端时也不使用。
option.quiet = 只输出结果，不输出进度和提示。
option.verbose = 输出引擎和插件的日志，以及错误的完整原因。
option.plugin-path = 存放插件包的目录；可以重复使用，或用路径分隔符分隔多个目录。默认取 PIPEFORGE_PLUGIN_PATH，其次是安装目录下的 plugins/。
option.dev = 额外加载 <root> 处（或当前目录所在）源码仓库中的插件模块，直接使用它们的构建输出。
option.var = 作业变量，写成 name=value，可以重复使用；优先于作业的 env.variables。
option.scheduled-time = 本次运行的计划时间，即 ${date:...} 的基准，写成 ISO-8601 时间，例如 2026-11-07T00:00:00Z。默认为当前时间。

validate.files = 作业文件，或目录（校验其中的 .yaml、.yml 和 .json 文件）。
explain.file = 作业文件。
run.file = 作业文件。
run.local = 在当前进程中运行。本版本必须指定；在集群上运行随分布式运行时提供。
run.dry-run = 只生成并输出作业的计划，不运行。
run.analyze = 运行结束后输出运行分析：节点、速率、等待时间和对账结果。
run.timeout = 运行超过这个时长（例如 30s、10m、2h）后取消，并以 5 退出。
expr.expression = 表达式，用引号括起来。
expr.row = 一行数据，写成 JSON 对象，例如 {"amount": 1200, "city": "杭州"}。
expr.column = 列的类型，写成 name TYPE，例如 "amount DECIMAL(10, 2)"；没有声明类型的列使用其 JSON 值的类型。
expr.timezone = 日期和时间使用的时区。
ui.port = 服务端的端口。
ui.no-browser = 不打开浏览器。
ui.server-jar = 要启动的服务端 jar，代替安装目录中的那个。
ui.start-timeout = 服务端启动最多等待的秒数。
completion.shell = bash 或 zsh。
dev.dir = 开发环境所在的目录，其中有 docker-compose.yaml。默认取当前目录所在源码仓库的 dev/，其次是安装目录的 dev/。
dev.up.services = 只启动这些服务及其依赖，例如 mysql。默认启动全部服务。
dev.up.s3 = 同时启动 s3 profile 中的服务：MinIO 及其存储桶。
dev.up.timeout = 等待服务变为健康的最长时间，例如 90s 或 5m。
dev.down.volumes = 同时删除数据卷；下次启动时重新创建示例数据。
plugin.validate.packages = 插件包：zip 文件，或解压后的目录。
plugin.project = 插件工程：包含 pom.xml 和 src/main/plugin/plugin.yaml 的目录。
plugin.test.groups = 只运行这些 testkit 用例组，用逗号分隔，例如 options,types；其他用例组跳过。
plugin.test.test = 只运行匹配的测试类，同 Maven 的 -Dtest，例如 *ContractTest。
plugin.maven = 使用的 Maven 命令；默认取工程或其上级目录中最近的 mvnw，否则使用 mvn。
plugin.docs.output-dir = 文档数据的写入位置；默认为工程的 src/generated/plugin-docs。
plugin.docs.check = 不写入，而是把文档数据与组件导出的内容比较；过期时以 3 退出。

