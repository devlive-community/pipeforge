run.status.written = 写入   {0} 行  {1} 行/秒
run.status.dirty = 跳过   {0} 行坏数据
run.status.bottleneck = 瓶颈 {0}：{1}
bottleneck.THROTTLE = 限流限制了读取
bottleneck.TARGET = 目标端最慢
bottleneck.NETWORK = Worker 之间的网络最慢
bottleneck.SOURCE = 源端最慢
bottleneck.NONE = 没有长时间的等待
bottleneck.UNKNOWN = 数据还不够
run.nodes.node = 节点
run.nodes.in = 输入
run.nodes.out = 输出
run.nodes.filtered = 过滤
run.nodes.dirty = 跳过
run.metrics.name = 指标
run.metrics.value = 值
run.logs.task-form = ''{0}'' 不是 src 或 src[3] 这样的 Task。
run.logs.no-task = 这次运行没有 Task {0}；它的 Task 有 {1}。
run.logs.follow-one = -f 只能跟随一个 Task：用 --task 选择，可选 {0}。
run.logs.header = ==> {0}[{1}]，位于 {2} <==
run.logs.level-invalid = ''{0}'' 不是日志级别：TRACE、DEBUG、INFO、WARN 或 ERROR。
run.cancel.confirm-flag = 命令不在终端上运行时，取消运行 {0} 需要指定 --yes。
run.cancel.confirm = 取消运行 {0}？[y/N] 
run.cancel.kept = 运行 {0} 继续进行。
run.cancel.done = 运行 {0} 现在是 {1}。

pipeforge.job.usage.description = 操作服务端上的作业。
pipeforge.job.explain.usage.description = 显示服务端用它的插件和设置为作业生成的计划，即集群将要运行的内容。explain 则使用本命令的插件生成计划。
pipeforge.cluster.usage.description = 显示服务端连接的集群。
pipeforge.cluster.status.usage.description = 显示 Master、已使用的 Slot 和 Worker，并统计心跳延迟的 Worker。
pipeforge.cluster.drain.usage.description = 不再向 Worker 分配新的 Task；正在它上面运行的 Task 在原地运行到结束。指定 --wait 时等待它们结束。
pipeforge.cluster.uncordon.usage.description = 重新向已下线的 Worker 分配新的 Task。
pipeforge.cluster.failover.usage.description = 请主 Master 交出租约，由备 Master 接管，运行从最近的 checkpoint 在那里继续。旧的主 Master 退出，由它的进程管理器重新启动为备 Master。
pipeforge.cluster.workers.usage.description = 显示各 Worker 的 Slot、Task、资源、最近心跳和标签。
job.explain.file = 作业文件。
cluster.master = Master   {0}  版本 {1}  协议 {2}  已运行 {3}
cluster.slots = Slot     已使用 {0} / {1}（{2}）
cluster.workers = Worker   已连接 {0} 个
cluster.late = ，其中 {0} 个心跳延迟（超过 15 秒没有心跳）
cluster.late-mark = 延迟
cluster.draining-mark = （下线中）
cluster.worker-id = Worker 的 ID，即 cluster workers 列出的 ID。
cluster.drain.wait = 等待直到该 Worker 上不再有运行中的 Task。
cluster.drain.timeout = 指定 --wait 时最多等待多久，例如 30m（默认）或 2h；届时仍有 Task 在运行则以退出码 5 结束。
cluster.drain.done = Worker {0} 不再接收新的 Task；正在运行的 Task 在原地运行到结束。
cluster.drain.waiting = Worker {0} 还在运行 {1} 个 Task……
cluster.drain.empty = Worker {0} 已下线：上面没有运行中的 Task。
cluster.drain.timeout-left = 等待 {2} 后，Worker {0} 仍在运行 {1} 个 Task。
cluster.uncordon.done = Worker {0} 重新接收新的 Task。
cluster.failover.yes = 不询问直接切换；命令不在终端上运行时必须指定。
cluster.failover.confirm-flag = 命令不在终端上运行时，切换主 Master 需要指定 --yes。
cluster.failover.confirm = 把集群的主 Master 身份交给备 Master？[y/N]
cluster.failover.kept = 主 Master 保持不变。
cluster.failover.done = Master {0} 已交出租约：备 Master 会在几秒内接管，{0} 随后退出。
cluster.column.worker = WORKER
cluster.column.address = 地址
cluster.column.slots = SLOT
cluster.column.tasks = TASK
cluster.column.cores = 核数
cluster.column.heap = 堆内存
cluster.column.heartbeat = 心跳
cluster.column.labels = 标签
