run.cluster = 暂时还不能在集群上运行：加上 --local 在当前进程中运行，或者用 --dry-run 只生成计划。
run.progress = 运行中 {0}  已读 {1}  已写 {2}  {3} 行/秒
run.summary = 作业 {0} {1}，用时 {2}：读取 {3} 行，写入 {4} 行（{5} 行/秒）
