# Points first-time contributors to the contribution guide.

name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue in PipeForge! Please make sure it contains everything the
            template asks for. Questions are best asked in GitHub Discussions.
          pr-message: |
            Thanks for your first pull request to PipeForge! Please read CONTRIBUTING.md: commits follow
            Conventional Commits and update the documentation in the same commit.
