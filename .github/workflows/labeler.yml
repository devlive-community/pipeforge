# Adds area/* labels to pull requests from the changed paths (.github/labeler.yml).
# pull_request_target is safe here: the job never checks out or runs pull request code.

name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: false
