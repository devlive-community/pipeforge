name: Feature proposal
description: Propose a new capability or a change to existing behavior.
title: "[Feature] "
labels: ["type/feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: api-change
    attributes:
      label: Does this change pipeforge-api or a protocol?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to help implement it?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
