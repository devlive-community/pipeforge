version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      build-plugins:
        patterns: ['*-plugin', '*maven-plugin*']
      test-libraries:
        patterns: ['org.junit*', 'org.assertj*', 'org.mockito*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
