# Configuration errors. Codes never change their meaning and are never reused.

- code: PF-CONF-0001
  name: OPTION_REQUIRED
  message:
    en-US: "Required option '{option}' is missing in node '{node}'"
    zh-CN: "节点 '{node}' 缺少必填选项 '{option}'"
  hint:
    en-US: "Add '{option}' to the node, or set it in env or in the cluster defaults."
    zh-CN: "在节点中添加 '{option}'，或者在 env 或集群默认配置中设置它。"

- code: PF-CONF-0002
  name: OPTION_INVALID
  message:
    en-US: "Option '{option}' of node '{node}' has the invalid value '{value}': {reason}"
    zh-CN: "节点 '{node}' 的选项 '{option}' 取值 '{value}' 不合法：{reason}"
  hint:
    en-US: "Check the type and the allowed range of '{option}' on the plugin page."
    zh-CN: "在插件文档页中查看 '{option}' 的类型和取值范围。"

- code: PF-CONF-0003
  name: NATIVE_KEY_CONTROLLED
  message:
    en-US: "Native option '{key}' of node '{node}' is controlled by PipeForge and cannot be set: {reason}"
    zh-CN: "节点 '{node}' 的原生配置 '{key}' 由 PipeForge 控制，不能设置：{reason}"
  hint:
    en-US: "Remove '{key}' from the native options; use the corresponding PipeForge option instead."
    zh-CN: "从原生配置中删除 '{key}'，改用对应的 PipeForge 选项。"

- code: PF-CONF-0004
  name: VARIABLE_UNDEFINED
  message:
    en-US: "Variable '${{variable}}' is not defined"
    zh-CN: "变量 '${{variable}}' 未定义"
  hint:
    en-US: "Define it in env.variables or pass a value when running the job, or give a default: ${{variable}:-default}."
    zh-CN: "在 env.variables 中定义它或在运行作业时传入取值，或者写上默认值：${{variable}:-默认值}。"

- code: PF-CONF-0005
  name: SECRET_NOT_FOUND
  message:
    en-US: "Secret '{secret}' does not exist"
    zh-CN: "密钥 '{secret}' 不存在"
  hint:
    en-US: "Create the secret first, or check its name and the project it belongs to."
    zh-CN: "先创建该密钥，或者检查密钥名称及其所属项目。"

- code: PF-CONF-0006
  name: JOB_INVALID
  message:
    en-US: "The job definition is invalid at {location}: {reason}"
    zh-CN: "作业定义在 {location} 处有误：{reason}"
  hint:
    en-US: "Compare the job with the job DSL reference; the location gives the line, column and path of the problem."
    zh-CN: "对照作业 DSL 参考检查作业；位置中给出了问题所在的行、列和路径。"

- code: PF-CONF-0007
  name: REQUEST_INVALID
  message:
    en-US: "The request is invalid: {reason}"
    zh-CN: "请求不合法：{reason}"
  hint:
    en-US: "Compare the request with the API reference; the reason names the field or the endpoint."
    zh-CN: "对照 API 参考检查请求；原因中指出了有问题的字段或接口。"
