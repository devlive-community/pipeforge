# Checkpoints and state.

- code: PF-CKPT-0001
  name: CHECKPOINT_TIMEOUT
  message:
    en-US: "Checkpoint {checkpoint} timed out after {timeoutMs} ms; still missing: {missing}"
    zh-CN: "checkpoint {checkpoint} 在 {timeoutMs} 毫秒后超时；仍未完成的：{missing}"
  hint:
    en-US: "The tasks listed did not finish their part in time, usually because of backpressure that holds the barrier back or a slow checkpoint storage. Raise env.checkpoint.timeout, or look at the run's backpressure and the storage."
    zh-CN: "列出的 Task 没有及时完成自己的部分，通常是背压拖住了 barrier，或者 checkpoint 存储太慢。请调大 env.checkpoint.timeout，或者检查运行的背压与存储。"

- code: PF-CKPT-0002
  name: STATE_CORRUPTED
  message:
    en-US: "The {file} of checkpoint {checkpoint} is damaged: {reason}"
    zh-CN: "checkpoint {checkpoint} 的 {file} 已损坏：{reason}"
  hint:
    en-US: "The file was cut short, changed or copied from another checkpoint. Recovery falls back to the checkpoint before it; check the checkpoint storage for errors."
    zh-CN: "文件被截断、被修改或者是从其他 checkpoint 拷来的。恢复时会退回到上一个 checkpoint；请检查 checkpoint 存储是否出错。"

- code: PF-CKPT-0003
  name: STATE_INCOMPATIBLE
  message:
    en-US: "The {file} of checkpoint {checkpoint} cannot be read: {reason}"
    zh-CN: "无法读取 checkpoint {checkpoint} 的 {file}：{reason}"
  hint:
    en-US: "It was written in a format this version does not read, usually by a newer PipeForge. Restore it with the version that wrote it, or start without it."
    zh-CN: "它使用的格式本版本无法读取，通常是由更新版本的 PipeForge 写入的。请用写入它的版本恢复，或者不使用它启动。"

- code: PF-CKPT-0004
  name: STORAGE_UNAVAILABLE
  message:
    en-US: "The checkpoint storage {location} cannot be used: {reason}"
    zh-CN: "无法使用 checkpoint 存储 {location}：{reason}"
  hint:
    en-US: "Check checkpoint.dir and, for object storage, its endpoint, region and credentials. Every master and worker must reach the same storage: on NFS the same directory at the same path, writable by the user the processes run as."
    zh-CN: "请检查 checkpoint.dir，以及对象存储的端点、区域和凭据。每个 Master 和 Worker 都必须能访问同一个存储：使用 NFS 时是同一路径下的同一个目录，并且运行进程的用户有写权限。"

- code: PF-CKPT-0005
  name: CHECKPOINT_DECLINED
  message:
    en-US: "Task {task} declined checkpoint {checkpoint}: {reason}"
    zh-CN: "Task {task} 拒绝了 checkpoint {checkpoint}：{reason}"
  hint:
    en-US: "A task that is still starting, or a worker that cannot take snapshots, declines. The checkpoint is given up and the next one is tried; the run fails only after env.checkpoint.tolerable-failures failures in a row."
    zh-CN: "仍在启动的 Task，或者无法做快照的 Worker 会拒绝。这次 checkpoint 会被放弃，之后会尝试下一次；只有连续失败超过 env.checkpoint.tolerable-failures 次，运行才会失败。"

- code: PF-CKPT-0006
  name: CHECKPOINT_FAILED
  message:
    en-US: "Checkpoint {checkpoint} failed: {reason}"
    zh-CN: "checkpoint {checkpoint} 失败：{reason}"
  hint:
    en-US: "The master could not write the checkpoint to the checkpoint storage or record it in the metastore. Check that both are reachable from the master."
    zh-CN: "Master 无法把 checkpoint 写入 checkpoint 存储，或者无法记入元数据库。请检查 Master 能否访问这两者。"

- code: PF-CKPT-0007
  name: TOO_MANY_CHECKPOINT_FAILURES
  message:
    en-US: "{failures} checkpoints failed in a row, more than the {limit} the job tolerates; the last: {last}"
    zh-CN: "连续 {failures} 个 checkpoint 失败，超过作业允许的 {limit} 个；最后一个：{last}"
  hint:
    en-US: "Without checkpoints a failure would lose more progress than the job allows, so the run fails. Fix the cause of the last failure, or raise env.checkpoint.tolerable-failures."
    zh-CN: "没有 checkpoint 时，一旦出错丢失的进度会超过作业允许的范围，因此运行失败。请解决最后一次失败的原因，或者调大 env.checkpoint.tolerable-failures。"
