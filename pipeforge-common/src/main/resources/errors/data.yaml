# Data errors: one row or record is bad; handled by the dirty data policy.

- code: PF-DATA-0001
  name: TYPE_CONVERSION
  message:
    en-US: "Column '{column}' cannot be converted to {type}: {reason}"
    zh-CN: "列 '{column}' 无法转换为 {type}：{reason}"
  hint:
    en-US: "Check the type the source reports for the column, and map it to the type you need explicitly, for example with a cast in a field mapper."
    zh-CN: "请检查源端报告的列类型，并显式映射为所需的类型，例如在字段映射中使用类型转换。"

- code: PF-DATA-0002
  name: VALUE_OUT_OF_RANGE
  message:
    en-US: "The value of column '{column}' is out of the range of {type}: {reason}"
    zh-CN: "列 '{column}' 的值超出了 {type} 的范围：{reason}"
  hint:
    en-US: "Widen the type, for example a DECIMAL with more precision, or convert the value before it reaches this node."
    zh-CN: "请放宽类型，例如使用精度更高的 DECIMAL，或者在值到达该节点之前先进行转换。"

- code: PF-DATA-0004
  name: CONSTRAINT_VIOLATION
  message:
    en-US: "Column '{column}' of '{table}' violates a constraint: {reason}"
    zh-CN: "'{table}' 的列 '{column}' 违反约束：{reason}"
  hint:
    en-US: "Fix the value at the source or relax the constraint, for example give a NOT NULL column a default."
    zh-CN: "在源头修正取值，或者放宽约束，例如为非空列设置默认值。"

- code: PF-DATA-0006
  name: EXPRESSION_ERROR
  message:
    en-US: "Expression '{expression}' failed: {reason}"
    zh-CN: "表达式 '{expression}' 计算失败：{reason}"
  hint:
    en-US: "Guard the expression (for example NULLIF(qty, 0) or TRY_CAST), or set on-error to null or fail on the node."
    zh-CN: "为表达式加上保护（例如 NULLIF(qty, 0) 或 TRY_CAST），或者在节点上把 on-error 设置为 null 或 fail。"

- code: PF-DATA-0007
  name: ROW_TOO_LARGE
  message:
    en-US: "A row of table {table} takes {bytes} bytes, more than task.max-row-bytes ({limit})"
    zh-CN: "表 {table} 的一行占用 {bytes} 字节，超过了 task.max-row-bytes（{limit}）"
  hint:
    en-US: "Look for very large values in the row, such as documents or files in one column, or raise task.max-row-bytes if the worker has the memory."
    zh-CN: "请检查行中是否有特别大的值，例如某一列中的文档或文件；如果 Worker 内存充足，也可以调大 task.max-row-bytes。"

- code: PF-DATA-0009
  name: BAD_ROW
  message:
    en-US: "'{node}' refused a row: {reason}"
    zh-CN: "'{node}' 拒绝了一行：{reason}"
  hint:
    en-US: "The row does not fit the target or the transformation. Fix the data at the source, map the column to a fitting type, or set env.dirty.policy to skip so that such rows are counted and skipped."
    zh-CN: "这一行不适合目标端或转换。请在源端修正数据、把该列映射为合适的类型，或者把 env.dirty.policy 设为 skip，让这类行被计数并跳过。"

- code: PF-DATA-0010
  name: TOO_MANY_DIRTY_ROWS
  message:
    en-US: "The job skipped {rows} bad rows, more than env.dirty.max-rows ({limit})"
    zh-CN: "作业跳过了 {rows} 个坏行，超过了 env.dirty.max-rows（{limit}）"
  hint:
    en-US: "The samples of the bad rows in the run's metrics show what is wrong. Fix the data or the mapping, or raise env.dirty.max-rows if that many bad rows are expected."
    zh-CN: "运行指标中的坏行样本说明了问题所在。请修正数据或映射；如果确实会有这么多坏行，可以调大 env.dirty.max-rows。"
