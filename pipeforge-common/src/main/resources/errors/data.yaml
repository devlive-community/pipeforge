# Data errors: one row or record is bad; handled by the dirty data policy.

- code: PF-DATA-0001
  name: TYPE_CONVERSION
  message:
    en-US: "Column '{column}' cannot be converted to {type}: {reason}"
    zh-CN: "列 '{column}' 无法转换为 {type}：{reason}"
  hint:
    en-US: "Check the type the source reports for the column, and map it to the type you need explicitly, for example with a cast in a field mapper."
    zh-CN: "请检查源端报告的列类型，并显式映射为所需的类型，例如在字段映射中使用类型转换。"

- code: PF-DATA-0002
  name: VALUE_OUT_OF_RANGE
  message:
    en-US: "The value of column '{column}' is out of the range of {type}: {reason}"
    zh-CN: "列 '{column}' 的值超出了 {type} 的范围：{reason}"
  hint:
    en-US: "Widen the type, for example a DECIMAL with more precision, or convert the value before it reaches this node."
    zh-CN: "请放宽类型，例如使用精度更高的 DECIMAL，或者在值到达该节点之前先进行转换。"

- code: PF-DATA-0004
  name: CONSTRAINT_VIOLATION
  message:
    en-US: "Column '{column}' of '{table}' violates a constraint: {reason}"
    zh-CN: "'{table}' 的列 '{column}' 违反约束：{reason}"
  hint:
    en-US: "Fix the value at the source or relax the constraint, for example give a NOT NULL column a default."
    zh-CN: "在源头修正取值，或者放宽约束，例如为非空列设置默认值。"

- code: PF-DATA-0006
  name: EXPRESSION_ERROR
  message:
    en-US: "Expression '{expression}' failed: {reason}"
    zh-CN: "表达式 '{expression}' 计算失败：{reason}"
  hint:
    en-US: "Guard the expression (for example NULLIF(qty, 0) or TRY_CAST), or set on-error to null or fail on the node."
    zh-CN: "为表达式加上保护（例如 NULLIF(qty, 0) 或 TRY_CAST），或者在节点上把 on-error 设置为 null 或 fail。"
