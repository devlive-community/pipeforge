# Cluster and process errors.

- code: PF-CLUS-0001
  name: WORKER_LOST
  message:
    en-US: "Worker {worker} ({address}) sent no heartbeat for {seconds} s and was removed from the cluster"
    zh-CN: "Worker {worker}（{address}）{seconds} 秒没有发送心跳，已从集群中移除"
  hint:
    en-US: "The worker stopped, is overloaded (long garbage collection pauses) or cannot reach the master over the network; its tasks fail. Read the end of the worker log."
    zh-CN: "该 Worker 已停止、过载（长时间的垃圾回收停顿），或者与 Master 之间网络不通；它上面的 Task 会失败。请查看该 Worker 日志的末尾。"

- code: PF-CLUS-0002
  name: SERVER_START_FAILED
  message:
    en-US: "The server did not start: {reason} (log: {log})"
    zh-CN: "服务端没有启动：{reason}（日志：{log}）"
  hint:
    en-US: "Read the end of the server log for the cause; a port that is in use or a Java version below 21 are common."
    zh-CN: "原因见服务端日志的末尾；常见原因是端口被占用或 Java 版本低于 21。"

- code: PF-CLUS-0003
  name: DOCKER_NOT_AVAILABLE
  message:
    en-US: "Docker is not available: {detail}"
    zh-CN: "Docker 不可用：{detail}"
  hint:
    en-US: "Install Docker with Compose v2 and start it; docker version and docker compose version must both work."
    zh-CN: "安装带 Compose v2 的 Docker 并启动它；docker version 和 docker compose version 都需要能正常运行。"

- code: PF-CLUS-0004
  name: DEV_ENVIRONMENT_FAILED
  message:
    en-US: "docker compose {action} failed with exit code {exit}"
    zh-CN: "docker compose {action} 失败，退出码为 {exit}"
  hint:
    en-US: "The docker compose output above names the service; pipeforge dev status shows the state of every service, and docker compose logs <service> its log."
    zh-CN: "上面的 docker compose 输出给出了出错的服务；pipeforge dev status 显示每个服务的状态，docker compose logs <服务> 显示它的日志。"

- code: PF-CLUS-0005
  name: RPC_UNAUTHENTICATED
  message:
    en-US: "{peer} sent a request without the token of this cluster"
    zh-CN: "{peer} 发来的请求没有携带本集群的令牌"
  hint:
    en-US: "Every master, worker and server of a cluster needs the same cluster.token; check the configuration of the process that sent it."
    zh-CN: "同一集群中的 Master、Worker 和 Server 都需要相同的 cluster.token；请检查发出请求的进程的配置。"

- code: PF-CLUS-0006
  name: RPC_STALE_EPOCH
  message:
    en-US: "Refused a request of {epoch} epoch {received}; this process knows epoch {known}"
    zh-CN: "拒绝了 {epoch} epoch 为 {received} 的请求；本进程已知的 epoch 为 {known}"
  hint:
    en-US: "The request comes from a master or job master that has been replaced. It is refused on purpose, so that only the current one controls the tasks; no action is needed."
    zh-CN: "请求来自一个已被替换的 Master 或 JobMaster。拒绝是有意的，以保证只有当前的 Master 控制 Task；无需处理。"

- code: PF-CLUS-0007
  name: RPC_VERSION_MISMATCH
  message:
    en-US: "Protocol version {remote} of the other side does not work with version {local} of this process"
    zh-CN: "对方的协议版本 {remote} 与本进程的版本 {local} 不兼容"
  hint:
    en-US: "Masters, workers and servers must have the same major protocol version; upgrade the cluster to one release."
    zh-CN: "Master、Worker 和 Server 的协议主版本必须相同；请把集群升级到同一个发行版本。"

- code: PF-CLUS-0008
  name: RPC_UNAVAILABLE
  message:
    en-US: "{target} cannot be reached: {reason}"
    zh-CN: "无法访问 {target}：{reason}"
  hint:
    en-US: "The process is down, overloaded or not reachable over the network. Requests are retried three times before this error; check that the process runs and that its port is open."
    zh-CN: "该进程已停止、过载，或者网络不通。出现这个错误之前请求已经重试了三次；请检查该进程是否在运行、端口是否可达。"

- code: PF-CLUS-0009
  name: SECRETS_UNREADABLE
  message:
    en-US: "The sensitive options of task {task} cannot be decrypted: {reason}"
    zh-CN: "无法解密 Task {task} 的敏感选项：{reason}"
  hint:
    en-US: "They were encrypted for another key of this worker, usually because the worker restarted after it registered; the task is deployed again once the worker has registered anew."
    zh-CN: "它们是为该 Worker 的另一个密钥加密的，通常是因为 Worker 在注册后重启过；Worker 重新注册后 Task 会被再次部署。"

- code: PF-CLUS-0010
  name: DATA_CONNECTION_LOST
  message:
    en-US: "The data connection to {peer} was lost: {reason}"
    zh-CN: "与 {peer} 的数据连接已断开：{reason}"
  hint:
    en-US: "The other worker stopped, paused for longer than three heartbeats of the connection, or the network between the workers failed. The tasks on both ends fail; check the log of the other worker and the network between them."
    zh-CN: "另一个 Worker 已停止、停顿超过连接的三次心跳，或者 Worker 之间的网络出现故障。两端的 Task 都会失败；请检查另一个 Worker 的日志以及两者之间的网络。"

- code: PF-CLUS-0011
  name: PARTITION_NOT_FOUND
  message:
    en-US: "The output {partition} is not on worker {worker}; it did not appear within {seconds} seconds"
    zh-CN: "Worker {worker} 上没有输出 {partition}，{seconds} 秒内也没有出现"
  hint:
    en-US: "The upstream task did not start on that worker, or it already failed. Look for the first error of the run; this one usually follows it."
    zh-CN: "上游 Task 没有在该 Worker 上启动，或者已经失败。请查找本次运行的第一个错误；这个错误通常是它的后果。"

- code: PF-CLUS-0012
  name: TASK_LOG_NOT_FOUND
  message:
    en-US: "Worker {worker} has no log of task {task}"
    zh-CN: "Worker {worker} 上没有 Task {task} 的日志"
  hint:
    en-US: "The task did not run on this worker, or its log was removed after worker.log.retention. Ask the worker the task ran on; the job master knows it."
    zh-CN: "该 Task 没有在这个 Worker 上运行，或者它的日志已超过 worker.log.retention 被清理。请向 Task 实际运行的 Worker 读取；JobMaster 知道是哪一个。"

- code: PF-CLUS-0013
  name: METASTORE_UNAVAILABLE
  message:
    en-US: "The metastore {url} cannot be reached: {reason}"
    zh-CN: "无法连接元数据库 {url}：{reason}"
  hint:
    en-US: "Check pipeforge.metastore.url, the user and password, that the database is running and that its JDBC driver is installed (for MySQL, in pipeforge.metastore.driver-dir)."
    zh-CN: "请检查 pipeforge.metastore.url、用户名和密码，确认数据库正在运行，并且已安装它的 JDBC 驱动（MySQL 的驱动放在 pipeforge.metastore.driver-dir 中）。"

- code: PF-CLUS-0014
  name: METASTORE_MIGRATION_FAILED
  message:
    en-US: "Migrating the metastore {url} failed: {reason}"
    zh-CN: "元数据库 {url} 迁移失败：{reason}"
  hint:
    en-US: "The schema was left at the last migration that succeeded. Fix the cause, for example the user's privileges, and start the server again; never edit a migration that was applied."
    zh-CN: "表结构停留在最后一个成功的迁移。请修正原因（例如用户权限）后重新启动服务端；不要修改已经执行过的迁移脚本。"

- code: PF-CLUS-0015
  name: MASTER_NOT_CONFIGURED
  message:
    en-US: "The server has no master to run jobs on"
    zh-CN: "服务端没有可以运行作业的 Master"
  hint:
    en-US: "Set pipeforge.master.address to the host:port of the cluster's master, with the cluster token in pipeforge.master.token."
    zh-CN: "请把 pipeforge.master.address 设置为集群 Master 的 host:port，并在 pipeforge.master.token 中设置集群令牌。"

- code: PF-CLUS-0016
  name: RUN_LOST
  message:
    en-US: "The master {master} no longer knows run {run}"
    zh-CN: "Master {master} 已经不知道运行 {run}"
  hint:
    en-US: "The master restarted, or another master took its place, while the run was going on; the run did not finish. Submit the job again."
    zh-CN: "运行期间 Master 重启了，或者被另一个 Master 取代，运行没有完成。请重新提交作业。"
