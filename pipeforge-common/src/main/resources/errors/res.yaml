# Resource errors.

- code: PF-RES-0001
  name: SLOTS_INSUFFICIENT
  message:
    en-US: "Job {job} needs {required} slot(s) but found {available} free within {timeout}"
    zh-CN: "作业 {job} 需要 {required} 个 Slot，但在 {timeout} 内只找到 {available} 个空闲 Slot"
  hint:
    en-US: "Add workers or slots (worker.slots), lower the parallelism of the job, relax its placement labels, or wait for other jobs to end; scheduler.slot-request-timeout sets how long a job waits."
    zh-CN: "增加 Worker 或 Slot（worker.slots）、降低作业的并行度、放宽放置标签，或者等待其他作业结束；作业等待的时间由 scheduler.slot-request-timeout 设置。"

- code: PF-RES-0005
  name: CANCEL_TIMEOUT
  message:
    en-US: "Subtask {subtask} of '{node}' did not stop within {timeoutMs} ms after it was cancelled"
    zh-CN: "'{node}' 的第 {subtask} 个子任务在取消后 {timeoutMs} 毫秒内仍未结束"
  hint:
    en-US: "The connector is blocked in a call that ignores cancellation and interrupts, often a network read without a timeout. Configure a socket or query timeout on the connector."
    zh-CN: "连接器阻塞在一个不响应取消和中断的调用中，通常是没有设置超时的网络读取。请为连接器配置连接或查询超时。"

- code: PF-RES-0006
  name: PORT_IN_USE
  message:
    en-US: "Port {port} is already in use"
    zh-CN: "端口 {port} 已被占用"
  hint:
    en-US: "Stop the process that uses it, or choose another port with --port."
    zh-CN: "停止占用该端口的进程，或者用 --port 选择其他端口。"

- code: PF-RES-0007
  name: SLOT_TAKEN
  message:
    en-US: "Slot {slot} of worker {worker} is reserved by allocation {holder}"
    zh-CN: "Worker {worker} 的 Slot {slot} 已被分配 {holder} 预留"
  hint:
    en-US: "Another job reserved the slot first; the scheduler takes another one. If this repeats, the master and the worker disagree about the slots: the next heartbeat brings them together."
    zh-CN: "另一个作业先预留了这个 Slot；调度器会改用其他 Slot。如果反复出现，说明 Master 与 Worker 对 Slot 的记录不一致，下一次心跳会使两者一致。"

- code: PF-RES-0008
  name: NETWORK_BUFFERS_INSUFFICIENT
  message:
    en-US: "{owner} needs {required} network buffers, but only {available} of {total} are free"
    zh-CN: "{owner} 需要 {required} 个网络缓冲，但 {total} 个中只有 {available} 个空闲"
  hint:
    en-US: "Each input channel takes network.buffers-per-channel buffers and each input network.floating-buffers-per-gate more. Give the worker more network memory (worker.memory.network), or lower the parallelism."
    zh-CN: "每个输入通道占用 network.buffers-per-channel 个缓冲，每个输入另外占用 network.floating-buffers-per-gate 个。请为 Worker 分配更多网络内存（worker.memory.network），或者降低并行度。"
