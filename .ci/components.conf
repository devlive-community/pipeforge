# Path rules for .ci/changed-components.sh: one CI job per component.
#
#   <component>: <pattern> [<pattern> ...]
#   _all:    <pattern> ...   any match forces a full run
#   _ignore: <pattern> ...   never triggers anything
#   !<pattern>               exclude from that component
#
# Which Maven modules the java job builds is decided separately by .ci/maven-modules.sh.

# CI wiring: changing how CI runs re-runs everything.
_all: .github/workflows/ci.yml .ci/**

# Never trigger a build job.
_ignore: **/*.md LICENSE .editorconfig .gitignore .github/ISSUE_TEMPLATE/** \
         .github/*.md .github/CODEOWNERS .github/dependabot.yml .github/labels.yml \
         .github/labeler.yml .idea/** .vscode/**

# Java modules: everything under a reactor module, plus the root build.
java: pom.xml **/pom.xml .mvn/** mvnw mvnw.cmd .java-version tools/spotbugs/** \
      pipeforge-*/** \
      !tools/build-checks/fixtures/**

# The build-check fixtures and their self-test.
build-checks: pom.xml .mvn/** mvnw mvnw.cmd tools/build-checks/** tools/spotbugs/** \
              tools/license-header/**

# Local development environment: docker compose, init scripts and helper scripts.
dev-env: dev/**
